<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Navio Labs | AI integration and workflow automation</title>
    <meta name="description" content="Practical AI integration, custom workflows, and full-stack solutions for growing businesses. Book a free workflow audit with Navio Labs." />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="Navio Labs" />
    <meta property="og:description" content="Practical AI integration, custom workflows, and full-stack solutions for growing businesses." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" />
    <script>
      // Set the colour theme before the page paints, so there is no flash.
      (function () {
        var root = document.documentElement, theme = null;
        try { theme = localStorage.getItem('navio-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
